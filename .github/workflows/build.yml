name: CI

# This fork's supported builds, checked for every pull request and every push
# to main:
#
# - server:  the Linux build (`ninja linux`, release, portable), which the
#            dedicated server runs (HALO_DEDICATED=1), as the deployment
#            builds it (Debian, clang 19, no profile-guided optimisation);
#            then the Linux port's tests and the dedicated server's control
#            channel test (tools/dedicated_control_test.py), neither of which
#            needs game data;
# - web:     the WebAssembly client (`ninja web`, multiplayer only), with the
#            Emscripten SDK the game is developed with (EMSDK_VERSION);
# - gateway: halo-gateway (port/gateway): go vet, go test -race, go build.
#
# Windows and Android code is inherited from the original repository and is
# not built. Nothing is published: no releases, and the only artifact is the
# web build, kept for three days.
#
# Kept cheap (a private repository's minutes):
# - compiles go through ccache (EM_COMPILER_WRAPPER for emcc); pushes to main
#   save the compile caches and every run restores the newest, so a pull
#   request only recompiles what it changed;
# - the Emscripten SDK is cached, keyed by its version and the SDL port;
# - a newer push to the same pull request or branch cancels a run still going;
# - changes that only touch documentation do not build.
on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "research/**"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "research/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EMSDK_VERSION: "6.0.10"
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_MAXSIZE: 500M
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  server:
    # Debian's clang 19, lld and 32-bit SDL 3 (libsdl3-dev:i386), as the
    # deployment's image (and the development box) builds the server.
    runs-on: ubuntu-24.04
    container: debian:trixie
    timeout-minutes: 30
    steps:
      - name: Install the toolchain
        run: |
          dpkg --add-architecture i386
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends \
            ca-certificates git clang lld ninja-build python3 python3-pytest ccache \
            gcc gcc-multilib libc6-dev-i386 libsdl3-dev:i386

      - uses: actions/checkout@v4

      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-server-${{ github.sha }}
          restore-keys: ccache-server-

      - name: Build (ninja linux, release)
        run: |
          python3 configure.py --portable --release --pgo=off --compiler-launcher ccache
          ninja linux

      - name: Linux port tests
        run: python3 -m pytest -q tools/test_linux_port.py

      - name: Dedicated server control test
        run: python3 tools/dedicated_control_test.py --binary build/linux/halo

      - name: Rotation rules test
        run: python3 tools/variant_overrides_test.py

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/cache/save@v4
        if: env.SAVE_CACHE == 'true'
        with:
          path: .ccache
          key: ccache-server-${{ github.sha }}

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EMSDK_DIR: ${{ github.workspace }}/.emsdk
      EM_COMPILER_WRAPPER: ccache
    steps:
      - name: Install ninja and ccache
        run: |
          mkdir -p "$RUNNER_TEMP/tools"
          curl -fsSL -o ninja.zip https://github.com/ninja-build/ninja/releases/download/v1.12.1/ninja-linux.zip
          unzip -q ninja.zip -d "$RUNNER_TEMP/tools" && rm ninja.zip
          curl -fsSL https://github.com/ccache/ccache/releases/download/v4.10.2/ccache-4.10.2-linux-x86_64.tar.xz \
            | tar -xJ -C "$RUNNER_TEMP/tools" --strip-components=1 ccache-4.10.2-linux-x86_64/ccache
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      # the SDK, with the libraries and the SDL port (port/web/ports) that
      # its first build compiles into its cache; keyed by the port too, so a
      # new SDL pin is built once and saved (an older cache of the same SDK
      # is restored rather than installing it again)
      - uses: actions/cache@v4
        id: emsdk
        with:
          path: ${{ env.EMSDK_DIR }}
          key: emsdk-${{ env.EMSDK_VERSION }}-${{ hashFiles('port/web/ports/*.py') }}-v1
          restore-keys: emsdk-${{ env.EMSDK_VERSION }}-

      - name: Install the Emscripten SDK
        if: steps.emsdk.outputs.cache-hit != 'true'
        run: |
          if [ ! -x "$EMSDK_DIR/emsdk" ]; then
            git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$EMSDK_DIR"
            "$EMSDK_DIR/emsdk" install "$EMSDK_VERSION"
            "$EMSDK_DIR/emsdk" activate "$EMSDK_VERSION"
            rm -rf "$EMSDK_DIR/downloads"
          fi

      - uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ccache-web-${{ github.sha }}
          restore-keys: ccache-web-

      # as the deployment builds it (multiplayer only; assertions on)
      - name: Build (ninja web)
        run: |
          source "$EMSDK_DIR/emsdk_env.sh"
          emcc --version | head -n 1
          python3 configure.py --pgo=off
          ninja web

      - name: Compile cache
        run: ccache --show-stats

      - uses: actions/cache/save@v4
        if: env.SAVE_CACHE == 'true'
        with:
          path: .ccache
          key: ccache-web-${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: halo-web
          path: |
            build/web/halo.js
            build/web/halo.wasm
            port/web/shell/halo-loader.js
            port/web/shell/play.html
          retention-days: 3

  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: port/gateway
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: port/gateway/go.mod
          cache-dependency-path: port/gateway/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race ./...

      - name: go build
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o halo-gateway .
